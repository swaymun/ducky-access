<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<rect width="1280" height="720" fill="#0b1120"/><rect x="62" y="48" width="1156" height="624" rx="28" fill="#101a31" stroke="#2d4070"/>
<text x="104" y="112" fill="#8ea2d9" font-family="Helvetica Neue,Arial" font-size="17" font-weight="700" letter-spacing="3">01  /  ACCESSIBILITY HINTS</text>
<text x="104" y="174" fill="#fff" font-family="Helvetica Neue,Arial" font-size="42" font-weight="700">Navigate by name, not position.</text>
<text x="106" y="214" fill="#aab7d6" font-family="Helvetica Neue,Arial" font-size="19">Tap NAV. Ducky Access finds actionable controls through the macOS Accessibility API.</text>
<rect x="104" y="274" width="502" height="304" rx="22" fill="#172440"/>
<text x="138" y="316" fill="#7f96cc" font-family="Helvetica Neue,Arial" font-size="14" font-weight="700" letter-spacing="2">CURRENT WINDOW</text>
<text x="138" y="356" fill="#fff" font-family="Helvetica Neue,Arial" font-size="25" font-weight="700">Ducky Access Help</text>
<g font-family="Helvetica Neue,Arial" font-size="13" font-weight="700"><rect x="138" y="390" width="176" height="42" rx="10" fill="#2f67f6"/><text x="226" y="416" fill="#fff" text-anchor="middle">A  Settings</text><rect x="328" y="390" width="176" height="42" rx="10" fill="#2f67f6"/><text x="416" y="416" fill="#fff" text-anchor="middle">B  Search</text><rect x="138" y="448" width="176" height="42" rx="10" fill="#2f67f6"/><text x="226" y="474" fill="#fff" text-anchor="middle">C  Continue</text><rect x="328" y="448" width="176" height="42" rx="10" fill="#2f67f6"/><text x="416" y="474" fill="#fff" text-anchor="middle">D  Close</text><rect x="138" y="506" width="366" height="42" rx="10" fill="#22375f"/><text x="321" y="532" fill="#bdd0ff" text-anchor="middle">Type a two-letter code → activate</text></g>
<text x="682" y="308" fill="#91a7df" font-family="Helvetica Neue,Arial" font-size="16" font-weight="700">THE FLOW</text>
<g font-family="Helvetica Neue,Arial"><circle cx="700" cy="375" r="28" fill="#2f67f6"/><text x="700" y="383" fill="#fff" text-anchor="middle" font-size="20" font-weight="700">1</text><text x="754" y="370" fill="#fff" font-size="22" font-weight="700">Press NAV</text><text x="754" y="398" fill="#9eafd2" font-size="17">Labels appear over buttons, links, fields, and menus.</text><circle cx="700" cy="468" r="28" fill="#2f67f6"/><text x="700" y="476" fill="#fff" text-anchor="middle" font-size="20" font-weight="700">2</text><text x="754" y="463" fill="#fff" font-size="22" font-weight="700">Tap letters</text><text x="754" y="491" fill="#9eafd2" font-size="17">The pad is your temporary keyboard.</text><circle cx="700" cy="561" r="28" fill="#2f67f6"/><text x="700" y="569" fill="#fff" text-anchor="middle" font-size="20" font-weight="700">3</text><text x="754" y="556" fill="#fff" font-size="22" font-weight="700">Press ESC</text><text x="754" y="584" fill="#9eafd2" font-size="17">Clear the overlay and return to normal.</text></g>
</svg>
