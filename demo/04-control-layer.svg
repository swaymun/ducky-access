<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<rect width="1280" height="720" fill="#0b1120"/><rect x="62" y="48" width="1156" height="624" rx="28" fill="#101a31" stroke="#2d4070"/>
<text x="104" y="112" fill="#8ea2d9" font-family="Helvetica Neue,Arial" font-size="17" font-weight="700" letter-spacing="3">03  /  CONTROL LAYER</text>
<text x="104" y="174" fill="#fff" font-family="Helvetica Neue,Arial" font-size="42" font-weight="700">A calm command surface.</text>
<text x="106" y="214" fill="#aab7d6" font-family="Helvetica Neue,Arial" font-size="19">One press opens the app switcher. The knobs do the obvious thing.</text>
<g font-family="Helvetica Neue,Arial"><rect x="104" y="278" width="318" height="280" rx="20" fill="#172440"/><circle cx="186" cy="356" r="42" fill="#314a7b"/><circle cx="186" cy="356" r="25" fill="#172440" stroke="#7c9eea" stroke-width="3"/><path d="M186 331v-10" stroke="#b8ceff" stroke-width="4" stroke-linecap="round"/><text x="252" y="350" fill="#fff" font-size="22" font-weight="700">Volume knob</text><text x="252" y="380" fill="#9eafd2" font-size="16">turn: volume</text><text x="252" y="404" fill="#9eafd2" font-size="16">press: mute</text><circle cx="186" cy="478" r="42" fill="#314a7b"/><circle cx="186" cy="478" r="25" fill="#172440" stroke="#7c9eea" stroke-width="3"/><path d="M186 453v-10" stroke="#b8ceff" stroke-width="4" stroke-linecap="round"/><text x="252" y="472" fill="#fff" font-size="22" font-weight="700">App knob</text><text x="252" y="502" fill="#9eafd2" font-size="16">turn: scroll</text><text x="252" y="526" fill="#9eafd2" font-size="16">press: ⌘Tab</text></g>
<rect x="474" y="278" width="330" height="280" rx="20" fill="#172440"/><text x="514" y="322" fill="#7f96cc" font-family="Helvetica Neue,Arial" font-size="14" font-weight="700" letter-spacing="2">COMMAND MODE</text><rect x="514" y="354" width="250" height="38" rx="10" fill="#2f67f6"/><text x="639" y="379" text-anchor="middle" fill="#fff" font-family="Helvetica Neue,Arial" font-size="16" font-weight="700">Focus Chrome</text><rect x="514" y="406" width="250" height="38" rx="10" fill="#253b65"/><text x="639" y="431" text-anchor="middle" fill="#c5d4fa" font-family="Helvetica Neue,Arial" font-size="16" font-weight="700">Switch tab</text><rect x="514" y="458" width="250" height="38" rx="10" fill="#253b65"/><text x="639" y="483" text-anchor="middle" fill="#c5d4fa" font-family="Helvetica Neue,Arial" font-size="16" font-weight="700">Scroll down</text><text x="514" y="530" fill="#6d82af" font-family="Helvetica Neue,Arial" font-size="14">No shell. No arbitrary control.</text>
<rect x="856" y="278" width="322" height="280" rx="20" fill="#132a2e" stroke="#2a725f"/><text x="896" y="322" fill="#66d8ad" font-family="Helvetica Neue,Arial" font-size="14" font-weight="700" letter-spacing="2">READY TO GO</text><text x="896" y="378" fill="#e2fff3" font-family="Helvetica Neue,Arial" font-size="25" font-weight="700">Menu bar</text><text x="896" y="414" fill="#b4dece" font-family="Helvetica Neue,Arial" font-size="17">model • reasoning • speed</text><text x="896" y="444" fill="#b4dece" font-family="Helvetica Neue,Arial" font-size="17">usage • last five dictations</text><text x="896" y="474" fill="#b4dece" font-family="Helvetica Neue,Arial" font-size="17">help • full local history</text><text x="104" y="622" fill="#7184b0" font-family="Helvetica Neue,Arial" font-size="16">The DuckyPad stays useful even when you stop looking at the screen.</text>
</svg>
